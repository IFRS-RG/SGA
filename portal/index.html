<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrições — IFRS Rio Grande</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-badge">IFRS</span> <span>Inscrições — Campus Rio Grande</span></div>
    <div id="userbox" class="userbox" hidden>
      <span id="user-email" class="user-email"></span>
      <button class="btn btn-ghost btn-sm" onclick="Portal.logout()">Sair</button>
    </div>
  </header>

  <main id="content" class="content">
    <!-- Login -->
    <section id="login" class="login-card">
      <h1>Portal de Inscrições</h1>
      <p class="muted">Entre com sua conta institucional <strong>@aluno.riogrande.ifrs.edu.br</strong> para ver as vagas e se inscrever.</p>
      <div id="gbtn"></div>
      <p id="login-msg" class="err" hidden></p>
    </section>

    <!-- App (após login) -->
    <section id="app" hidden>
      <nav class="tabs">
        <button class="tab active" id="tab-vagas" onclick="Portal.showTab('vagas')">Vagas abertas</button>
        <button class="tab" id="tab-minhas" onclick="Portal.showTab('minhas')">Minhas inscrições</button>
      </nav>
      <div id="panel"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <!-- Modal simples -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-x" onclick="Portal.closeModal()">×</button></div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="Portal.closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="modal-ok">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
